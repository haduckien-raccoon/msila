project:
  name: msila
  protocol_version: "1.0"

environment:
  python: "3.12"

dataset:
  name: mvtec_ad2
  category: null
  root: null

input:
  preserve_aspect_ratio: true
  tile_size: 512
  context_size: 768
  overlap: 128

backbone:
  name: dinov3_vitb16
  frozen: true
  feature_blocks: [4, 8, 12]

adapter:
  enabled: false
  bottleneck: null

fusion:
  type: null

illumination:
  enabled: false
  lambda_illum: 0.0

training:
  seed: 42
  num_updates: null
  batch_size: null
  learning_rate: null
  precision: null

evaluation:
  primary_metric: au_pro_0.05
  seg_f1: true
  boundary_f1: true

logging:
  save_environment: true
  save_config: true
  save_checkpoint: true

data:
  cache_dir: null
  mvtec_ad2: /content/drive/MyDrive/[Q3-4] 2026/[S7] Computer Vision/CV-Nhóm 9/data/
  train_dir: null
  val_dir: null

# project real paths, relative to the root of the project -> train on colab
project_root: 
  benchmark_root: msila/benchmark
  configs: msila/configs
  metadata: msila/metadata
  outputs: msila/outputs
  src: msila/src
  tests: msila/tests
  analysis: msila/src/analysis
  data: msila/src/data
  eval: msila/src/eval
  geometry: msila/src/geometry
  losses: msila/src/losses
  metrics: msila/src/metrics
  models: msila/src/models
  tools: msila/src/tools
  train: msila/src/train
  utils: msila/src/utils
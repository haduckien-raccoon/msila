# TV2-owned E0 only; all settings declared before DEV, no TEST tuning.
version: g2_e0_v1
categories: [can, fabric, fruit_jelly, rice, sheet_metal, vial, wallplugs, walnuts]
output_root: outputs/G2/E0
backbone:
  name: dinov3_vitb16
  repo_dir: third_party/dinov3
  checkpoints:
    dinov3_vits16: models/dinov3_vits16_pretrain_lvd1689m-08c60483.pth
    dinov3_vits16plus: models/dinov3_vits16plus_pretrain_lvd1689m-4057cbaa.pth
    dinov3_vitb16: models/dinov3_vitb16_pretrain_lvd1689m-73cec8be.pth
    dinov3_vitl16: models/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth
    dinov3_vith16plus: models/dinov3_vith16plus_pretrain_lvd1689m-7c1da9a5.pth
  norm: true
data:
  root: data/mvtec_ad2
  train_split: TRAIN/good
  dev_split: VALIDATION/good
  tile_size: 512
  overlap: 128
  max_train_sources: null
  max_dev_sources: 4
  dev_variants_per_image: 6
synthetic_protocol: configs/full_scale_synthetic.yaml
memory:
  max_features: 32768
  sampling_seed: 2026
  tile_batch_size: 4
  distance: euclidean  # euclidean | squared_euclidean | cosine
  normalize: false
  device: cpu  # Or cuda; independent of the backbone device.
  query_chunk_size: 256
  bank_chunk_size: 2048
evaluation:
  dev_seed: 17017
  tile_batch_size: 4
  max_fpr: 0.05
  score_transform: distance_over_distance_plus_scale
  score_scale: 1.0
  save_maps: false
  test_for_tuning: false
smoke:
  max_features: 32
  max_train_sources: 1
  max_dev_sources: 1
  dev_variants_per_image: 3

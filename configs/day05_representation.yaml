# MS-ILA — Day 05 representation ablation
# Project-relative path: msila/configs/day05_representation.yaml
#
# IMPORTANT
# ---------
# `base_config` records the canonical project config path. PyYAML itself does
# not implement cross-file inheritance, so the Day-05 runner must load
# `base_config` first and then overlay ONLY the selected representation entry.
# This prevents R0/R1/R2 from silently changing Adapter/Fusion/Decoder/Loss.

version: 1
experiment:
  name: day05_representation_ablation
  base_config: msila/configs/default.yaml
  only_variable: representation_source
  candidate_ids: [R0, R1, R2]

# ---------------------------------------------------------------------------
# Scientific lock for Day 05.
# These values are common to R0/R1/R2 and must not change between candidates.
# ---------------------------------------------------------------------------
locked:
  input:
    preserve_aspect_ratio: true
    tile_size: 512
    context_size: 768
    overlap: 128

  backbone:
    name: dinov3_vits16
    frozen: true
    feature_blocks: [4, 8, 12]

  geometry:
    # Context features used by R2 must already be mapped to the Local frame
    # before FeatureSelector/Mean Fusion.
    context_to_local_alignment: required

  adapter:
    # Reuse the single Day-04 selected Adapter configuration for ALL R0/R1/R2.
    # Do not copy the Day-03 QA reference (r=64,d=256) here: it was not a
    # scientifically selected Day-04 winner.
    source: day04_locked_selected_candidate
    trainable: true
    kernel_size: 3
    gamma_init: 0.0

  projection:
    enabled: true
    fusion_dim: 64
    share_across_views: true
    # Keep the already-locked project projection width unchanged.
    # It is deliberately not re-tuned in this representation ablation.
    dimension_source: locked_previous_day

  fusion:
    type: mean
    trainable: false
    allowed_num_sources: [1, 3, 6]
    return_weights: true

  decoder:
    type: basic_decoder
    architecture: conv3x3_gelu_conv1x1_bilinear
    trainable: true

  loss:
    type: anomaly_segmentation
    bce_weight: 1.0
    dice_weight: 1.0
    illumination_weight: 0.0

  training:
    seed: 42

  evaluation:
    primary_metric: au_pro_0.05

# ---------------------------------------------------------------------------
# The ONLY Day-05 variable: representation source.
# Deterministic source order is part of the experiment contract.
# ---------------------------------------------------------------------------
representations:
  R0:
    name: deep_only
    mode: deep_only
    sources:
      - local_b12
    num_sources: 1
    hypothesis: "Deep semantic feature alone is sufficient for localization."

  R1:
    name: multi_layer_local
    mode: multi_local
    sources:
      - local_b4
      - local_b8
      - local_b12
    num_sources: 3
    hypothesis: "Adding intermediate Local layers improves localization."

  R2:
    name: multi_layer_local_context
    mode: multi_local_context
    sources:
      - local_b4
      - local_b8
      - local_b12
      - context_b4
      - context_b8
      - context_b12
    num_sources: 6
    hypothesis: "Aligned Context adds information beyond multi-layer Local features."

# Hard exclusions for a clean ablation.
forbidden_changes:
  brute_force_layer_combinations: true
  attention_fusion: true
  illumination_loss: true
  candidate_specific_adapter: true
  candidate_specific_decoder: true
  candidate_specific_loss: true
  candidate_specific_tile_or_context_size: true

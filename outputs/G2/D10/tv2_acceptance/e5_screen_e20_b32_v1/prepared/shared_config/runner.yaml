version: g2_runner_v2
model_config: configs/g2_experiments.yaml
backbone: dinov3_vitb16
output_root: outputs/G2/D6
stage_output_roots:
  E3: outputs/G2/D7
  E4: outputs/G2/D8
  fusion_preflight: outputs/G2/D9
  E5: outputs/G2/D9
adapter_grids:
  dinov3_vits16:
    r_values:
    - 32
    - 64
    - 128
    d_values:
    - 128
    - 256
    - 384
  dinov3_vitb16:
    r_values:
    - 64
    - 128
    - 256
    d_values:
    - 256
    - 512
    - 768
  dinov3_vith16plus:
    r_values:
    - 128
    - 256
    - 384
    d_values:
    - 384
    - 768
    - 1280
selection:
  status: pending_joint_selection_D10
  method: joint_rd_fusion
  legacy_adapter_lock: audit_only
training:
  checkpoint_interval_steps: 20
execution:
  full_device: cuda
  deterministic_resize: true
smoke:
  epochs: 1
  max_steps: 2
  max_train_sources: 2
  max_dev_sources: 1
  dev_variants_per_image: 3
screening_budget:
  epochs: 20
  batch_size: 32
  max_steps: null
  max_minutes: null
